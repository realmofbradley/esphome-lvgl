# Guition ESP32-S3-4848S040
substitutions:
  name: "bathroom-mini-display"
  friendly_name: "Mini Bathroom Display"
  room: "Bathroom"
  # Home Assistant URL the display downloads backgrounds and artwork from.
  # No trailing slash. Required: the build stops with an error if unset.
  ha_base_url: "http://192.168.1.100:8123"
  # Home Assistant weather entity for the ambient face. Required.
  weather_entity: "weather.forecast_home"
  # Home Assistant sensors shown in the Bathroom climate pill. Required.
  bathroom_temperature_entity: "sensor.YOUR_TEMPERATURE_SENSOR"
  bathroom_humidity_entity: "sensor.YOUR_HUMIDITY_SENSOR"
  # Home Assistant entities used by the Bathroom Controls page.
  bathroom_light_entity: "light.YOUR_BATHROOM_LIGHT"
  bathroom_fan_entity: "fan.YOUR_BATHROOM_FAN"
  bathroom_heat_entity: "climate.YOUR_HEATER"

# Wifi Setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Packages
packages:
  setup:
    url: https://github.com/realmofbradley/esphome-lvgl/
    file: guition-esp32-s3-4848s040/package.yaml
    refresh: 1sec
