# Bathroom entity choices are stored on the device, independently of firmware.
# Empty values disable a side of the pill; other values must be sensor entity IDs.
text:
  - platform: template
    name: "Bathroom Temperature Sensor"
    id: bathroom_temperature_entity
    entity_category: config
    icon: "mdi:thermometer"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 100
    pattern: '^(sensor\.[a-z0-9_]+)?$'
    on_value:
      - lambda: 'id(bathroom_temperature_value) = NAN;'
      - script.execute: update_bathroom_climate
      - script.execute:
          id: subscribe_bathroom_sensor
          entity: !lambda 'return x;'
      - script.execute: persist_bathroom_sensor_settings

  - platform: template
    name: "Bathroom Humidity Sensor"
    id: bathroom_humidity_entity
    entity_category: config
    icon: "mdi:water-percent"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 100
    pattern: '^(sensor\.[a-z0-9_]+)?$'
    on_value:
      - lambda: 'id(bathroom_humidity_value) = NAN;'
      - script.execute: update_bathroom_climate
      - script.execute:
          id: subscribe_bathroom_sensor
          entity: !lambda 'return x;'
      - script.execute: persist_bathroom_sensor_settings

globals:
  - id: bathroom_temperature_value
    type: float
    initial_value: 'NAN'
  - id: bathroom_humidity_value
    type: float
    initial_value: 'NAN'

esphome:
  on_boot:
    - priority: -100
      then:
        - delay: 10s
        - wait_until:
            condition:
              lambda: |-
                const std::string condition = id(weather_condition_state).state;
                const std::string sun = id(sun_state).state;
                return !condition.empty() &&
                       (sun == "above_horizon" || sun == "below_horizon");
        - script.execute: update_weather_icon
        - script.execute: update_weather_background

script:
  - id: persist_bathroom_sensor_settings
    mode: restart
    then:
      # TemplateText saves after on_value returns. Flush on the next turn so
      # even a subsequent reboot need not wait for the normal flash interval.
      - delay: 250ms
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGW("bathroom", "Could not flush bathroom sensor settings");
          }

  - id: update_bathroom_climate
    then:
      - lambda: |-
          // Restored text values can fire before LVGL has created the label.
          if (id(bathroom_climate) == nullptr) return;
          char temperature[64] = "--.-°";
          char humidity[16] = "--%";
          if (std::isfinite(id(bathroom_temperature_value))) {
            snprintf(temperature, sizeof(temperature), "%.1f°",
                     id(bathroom_temperature_value));
          }
          if (std::isfinite(id(bathroom_humidity_value))) {
            snprintf(humidity, sizeof(humidity), "%.0f%%",
                     id(bathroom_humidity_value));
          }
          const std::string label = std::string(temperature) + "  ·  " + humidity;
          lv_label_set_text(id(bathroom_climate), label.c_str());

  - id: subscribe_bathroom_sensor
    parameters:
      entity: string
    then:
      - lambda: |-
          if (entity.empty()) return;
          // Also enforce the entity format on-device if a client bypasses the
          // text pattern advertised to Home Assistant.
          if (entity.rfind("sensor.", 0) != 0 || entity.size() <= 7 ||
              entity.find_first_not_of("abcdefghijklmnopqrstuvwxyz0123456789_", 7)
                  != std::string::npos) {
            ESP_LOGW("bathroom", "Bathroom sensor must be a full sensor. entity ID");
            return;
          }
          auto *api_server = esphome::api::global_api_server;
          if (api_server == nullptr) return;

          // The API has no unsubscribe method. Register each distinct entity
          // only once per boot, and ignore it whenever it is no longer selected.
          // Sharing this list also handles both fields choosing the same entity.
          static std::vector<std::string> registered_entities;
          bool already_registered = false;
          for (const auto &registered : registered_entities) {
            if (registered == entity) {
              already_registered = true;
              break;
            }
          }
          if (!already_registered) {
            using state_cb = std::function<void(esphome::StringRef)>;
            api_server->subscribe_home_assistant_state(
                entity, esphome::optional<std::string>(""),
                state_cb([entity](esphome::StringRef state) {
                  const bool temperature_selected =
                      id(bathroom_temperature_entity).state == entity;
                  const bool humidity_selected =
                      id(bathroom_humidity_entity).state == entity;
                  if (!temperature_selected && !humidity_selected) return;

                  auto parsed = esphome::parse_number<float>(state.str());
                  const float value = parsed.has_value() && std::isfinite(parsed.value())
                      ? parsed.value() : NAN;
                  if (temperature_selected) id(bathroom_temperature_value) = value;
                  if (humidity_selected) {
                    id(bathroom_humidity_value) =
                        value >= 0.0f && value <= 100.0f ? value : NAN;
                  }
                  id(update_bathroom_climate).execute();
                }));
            registered_entities.push_back(entity);
          }

          // Registration alone is advertised on the next API connection.
          // Tell an already connected HA client now, without rebooting.
          // A previously registered entity only needs a fresh state request;
          // once=true avoids adding another HA listener when reselecting it.
          for (const auto &client : api_server->active_clients()) {
            if (client->is_marked_for_removal() || !client->is_authenticated() ||
                std::string(client->get_name()).find("Home Assistant")
                    == std::string::npos) continue;
            esphome::api::SubscribeHomeAssistantStateResponse request;
            request.entity_id = esphome::StringRef(entity);
            request.once = already_registered;
            if (!client->send_message(request)) {
              // A full transmit buffer must not silently lose the selection.
              // Reconnecting renegotiates registered subscriptions, no reboot.
              ESP_LOGW("bathroom", "Subscription send failed; reconnecting HA");
              client->on_fatal_error();
            }
          }

  - id: update_weather_icon
    then:
      - if:
          condition:
            lambda: |-
              const std::string condition = id(weather_condition_state).state;
              const std::string sun = id(sun_state).state;
              return !condition.empty() &&
                     (sun == "above_horizon" || sun == "below_horizon");
          then:
            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "sunny" &&
                           id(sun_state).state == "above_horizon";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_clear_day

            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "sunny" &&
                           id(sun_state).state == "below_horizon";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_clear_night

            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "clear-night";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_clear_night

            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "partlycloudy" &&
                           id(sun_state).state == "above_horizon";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_partly_cloudy_day

            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "partlycloudy" &&
                           id(sun_state).state == "below_horizon";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_partly_cloudy_night

            - if:
                condition:
                  lambda: |-
                    const std::string condition = id(weather_condition_state).state;
                    return condition == "cloudy" || condition == "windy" ||
                           condition == "windy-variant" || condition == "exceptional" ||
                           condition == "unavailable" || condition == "unknown";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_cloudy

            - if:
                condition:
                  lambda: |-
                    const std::string condition = id(weather_condition_state).state;
                    return condition == "rainy" || condition == "pouring" ||
                           condition == "hail";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_rain

            - if:
                condition:
                  lambda: |-
                    const std::string condition = id(weather_condition_state).state;
                    return condition == "snowy" || condition == "snowy-rainy";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_snow

            - if:
                condition:
                  lambda: |-
                    return id(weather_condition_state).state == "fog";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_fog

            - if:
                condition:
                  lambda: |-
                    const std::string condition = id(weather_condition_state).state;
                    return condition == "lightning" ||
                           condition == "lightning-rainy";
                then:
                  - lvgl.image.update:
                      id: weather_icon
                      src: weather_thunderstorm

  - id: update_weather_background
    then:
      - if:
          condition:
            lambda: |-
              const std::string condition = id(weather_condition_state).state;
              const std::string sun = id(sun_state).state;
              return !condition.empty() &&
                     (sun == "above_horizon" || sun == "below_horizon");
          then:
            - online_image.set_url:
                id: ambient_background_image
                url: !lambda |-
                  const std::string condition = id(weather_condition_state).state;
                  const bool is_night = id(sun_state).state == "below_horizon";
                  std::string filename = "cloudy.jpg";

                  if (condition == "sunny") {
                    filename = is_night ? "clear-night.jpg" : "clear-day.jpg";
                  } else if (condition == "clear-night") {
                    filename = "clear-night.jpg";
                  } else if (condition == "partlycloudy") {
                    filename = is_night
                        ? "partly-cloudy-night.jpg"
                        : "partly-cloudy-day.jpg";
                  } else if (condition == "rainy" || condition == "pouring" ||
                             condition == "hail") {
                    filename = "rain.jpg";
                  } else if (condition == "snowy" || condition == "snowy-rainy") {
                    filename = is_night ? "snowy-night.jpg" : "snowy-day.jpg";
                  } else if (condition == "fog") {
                    filename = "fog.jpg";
                  } else if (condition == "lightning" ||
                             condition == "lightning-rainy") {
                    filename = "thunderstorm.jpg";
                  }

                  return "http://192.168.20.15:8123/local/guition/backgrounds/" +
                         filename;
                update: true

text_sensor:
  - platform: homeassistant
    id: weather_condition_state
    entity_id: weather.toronto_forecast

    on_value:
      then:
        - lvgl.label.update:
            id: weather_condition
            text: !lambda |-
              if (x == "clear-night") return std::string("Clear Night");
              if (x == "sunny") return std::string("Sunny");
              if (x == "partlycloudy") return std::string("Partly Cloudy");
              if (x == "cloudy") return std::string("Cloudy");
              if (x == "fog") return std::string("Fog");
              if (x == "hail") return std::string("Hail");
              if (x == "lightning" || x == "lightning-rainy") {
                return std::string("Thunderstorm");
              }
              if (x == "pouring") return std::string("Heavy Rain");
              if (x == "rainy") return std::string("Rain");
              if (x == "snowy") return std::string("Snow");
              if (x == "snowy-rainy") return std::string("Sleet");
              if (x == "windy" || x == "windy-variant") {
                return std::string("Windy");
              }
              if (x == "exceptional") return std::string("Exceptional");
              if (x == "unavailable") return std::string("Unavailable");
              if (x == "unknown") return std::string("Unknown");

              return x;

        - script.execute: update_weather_icon
        - script.execute: update_weather_background

  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun

    on_value:
      then:
        - script.execute: update_weather_icon
        - script.execute: update_weather_background

sensor:
  - platform: homeassistant
    id: weather_temperature_sensor
    entity_id: weather.toronto_forecast
    attribute: temperature

    on_value:
      then:
        - lvgl.label.update:
            id: weather_temperature
            text: !lambda |-
              char text[16];
              snprintf(text, sizeof(text), "%.0f°", x);
              return std::string(text);
