# Media integration adapted from jtenniswood/esphome-media-player.
# Keeps this project's ambient UI and navigation while reusing the mature
# runtime subscription, artwork URL, retry, progress and grouping behaviour.

substitutions:
  media_player_default: ""
  speaker_group_sensor: "sensor.speaker_group"

external_components:
  - source: github://jtenniswood/esphome-media-player@8ab172b688861893db0cedc93abdb150932eccfc
    components: [artwork_image]
    refresh: 1d

http_request:
  id: media_http_request
  verify_ssl: false
  timeout: 6500ms

artwork_image:
  - id: album_art_image
    url: "${ha_base_url}/local/guition/backgrounds/cloudy.jpg"
    format: AUTO
    type: RGB565
    byte_order: little_endian
    resize: 480x480
    buffer_size: 65536
    allow_insecure_local_urls: true
    on_download_finished:
      - logger.log:
          level: WARN
          tag: graphics_diag
          format: "ARTWORK: download finished"
      - script.execute:
          id: log_memory_diagnostics
          reason: "artwork_download_finished"
      - script.execute: apply_downloaded_artwork
    on_error:
      - script.execute: retry_artwork

globals:
  - id: media_subscription_generation
    type: int
    initial_value: '0'
  - id: subscribed_media_entity
    type: std::string
    initial_value: '""'
  - id: media_last_artwork_url
    type: std::string
    initial_value: '""'
  # True while the player is "playing", so the page only switches to
  # Now Playing when playback starts, not on every repeated state update.
  - id: media_was_playing
    type: bool
    initial_value: 'false'
  - id: artwork_retry_count
    type: int
    initial_value: '0'
  - id: media_base_position
    type: float
    initial_value: '0.0f'
  - id: media_position_millis
    type: uint32_t
    initial_value: '0'
  - id: media_duration_value
    type: float
    initial_value: '0.0f'
  - id: media_volume_value
    type: float
    initial_value: '0.0f'
  - id: media_volume_pending_pct
    type: int
    initial_value: '-1'
  - id: media_volume_pending_until
    type: uint32_t
    initial_value: '0'
  - id: speaker_count
    type: int
    initial_value: '0'
  - id: speaker_entity_ids
    type: std::string[6]
  - id: speaker_names
    type: std::string[6]
  - id: speaker_volumes
    type: 'std::array<float, 6>'
    initial_value: 'std::array<float, 6>{}'
  - id: speaker_grouped
    type: 'std::array<bool, 6>'
    initial_value: 'std::array<bool, 6>{}'
  - id: group_volume_index
    type: int
    initial_value: '0'
  - id: speaker_page
    type: int
    initial_value: '0'
  - id: speaker_reported_volumes
    type: 'std::array<float, 6>'
    initial_value: 'std::array<float, 6>{}'
  - id: speaker_volume_pending_pct
    type: 'std::array<int, 6>'
    initial_value: 'std::array<int, 6>{-1, -1, -1, -1, -1, -1}'
  - id: speaker_volume_pending_until
    type: 'std::array<uint32_t, 6>'
    initial_value: 'std::array<uint32_t, 6>{}'

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return client_info.find("Home Assistant") != std::string::npos;'
        then:
          - script.execute: subscribe_selected_media_player
          - script.execute: parse_speakers

text:
  - platform: template
    name: "Media Player"
    id: media_player_entity
    entity_category: config
    icon: "mdi:cast-audio"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${media_player_default}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: subscribe_selected_media_player
      # Native API subscriptions are negotiated at connection time. Persist and
      # reboot only for an operator-initiated change while HA is connected.
      - delay: 500ms
      - if:
          condition:
            lambda: |-
              return !x.empty() && x.rfind("media_player.", 0) == 0
                  && esphome::api::global_api_server != nullptr
                  && esphome::api::global_api_server->is_connected();
          then:
            - lambda: 'global_preferences->sync();'
            - delay: 200ms
            - lambda: 'App.safe_reboot();'

  - platform: template
    name: "Preset 1 Name"
    id: music_preset_1_name
    entity_category: config
    icon: "mdi:form-textbox"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Preset 1"
    min_length: 0
    max_length: 40
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 1 Icon"
    id: music_preset_1_icon
    entity_category: config
    icon: "mdi:emoticon-music-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "mdi:weather-sunset-up"
    min_length: 0
    max_length: 64
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 1 URI"
    id: music_preset_1_uri
    entity_category: config
    icon: "mdi:link-variant"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255

  - platform: template
    name: "Preset 2 Name"
    id: music_preset_2_name
    entity_category: config
    icon: "mdi:form-textbox"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Preset 2"
    min_length: 0
    max_length: 40
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 2 Icon"
    id: music_preset_2_icon
    entity_category: config
    icon: "mdi:emoticon-music-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "mdi:playlist-music"
    min_length: 0
    max_length: 64
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 2 URI"
    id: music_preset_2_uri
    entity_category: config
    icon: "mdi:link-variant"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255

  - platform: template
    name: "Preset 3 Name"
    id: music_preset_3_name
    entity_category: config
    icon: "mdi:form-textbox"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Preset 3"
    min_length: 0
    max_length: 40
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 3 Icon"
    id: music_preset_3_icon
    entity_category: config
    icon: "mdi:emoticon-music-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "mdi:heart"
    min_length: 0
    max_length: 64
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 3 URI"
    id: music_preset_3_uri
    entity_category: config
    icon: "mdi:link-variant"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255

  - platform: template
    name: "Preset 4 Name"
    id: music_preset_4_name
    entity_category: config
    icon: "mdi:form-textbox"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "Preset 4"
    min_length: 0
    max_length: 40
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 4 Icon"
    id: music_preset_4_icon
    entity_category: config
    icon: "mdi:emoticon-music-outline"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "mdi:headphones"
    min_length: 0
    max_length: 64
    on_value:
      - script.execute: update_music_presets

  - platform: template
    name: "Preset 4 URI"
    id: music_preset_4_uri
    entity_category: config
    icon: "mdi:link-variant"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255

# A local ESPHome event is the momentary Daily Briefing control, matching the
# Bathroom Night tile pattern. Home Assistant automations listen for "pressed".
event:
  - platform: template
    name: "Daily Briefing"
    id: daily_briefing_event
    icon: "mdi:newspaper"
    device_class: button
    event_types:
      - pressed

text_sensor:
  - platform: template
    id: media_title_sensor
    on_value:
      - lvgl.label.update:
          id: media_title_label
          text: !lambda 'return x.empty() ? std::string("--") : x;'

  - platform: template
    id: media_artist_sensor
    on_value:
      - lvgl.label.update:
          id: media_artist_label
          text: !lambda 'return x;'

  - platform: template
    id: media_state_sensor
    on_value:
      - script.execute: update_media_state

  - platform: template
    id: media_picture_sensor
    on_value:
      - if:
          condition:
            lambda: |-
              if (x.empty()) return false;
              std::string path = x;
              while (!path.empty() && (path.back() == '\n' || path.back() == '\r' || path.back() == ' ')) path.pop_back();
              std::string url = (path.rfind("http://", 0) == 0 || path.rfind("https://", 0) == 0)
                  ? path : std::string("${ha_base_url}") + path;
              url = esphome::artwork_image::cap_artwork_url(url, 480);
              if (url == id(media_last_artwork_url)) return false;
              id(media_last_artwork_url) = url;
              id(artwork_retry_count) = 0;
              return true;
          then:
            - script.execute: download_artwork

  - platform: template
    id: media_position_updated_at_sensor

  - platform: template
    id: media_source_sensor
    on_value:
      - lambda: |-
          const size_t start = x.find_first_not_of(" \t\r\n");
          const std::string source = start == std::string::npos ? ""
              : x.substr(start, x.find_last_not_of(" \t\r\n") - start + 1);
          std::string normalized = source;
          for (char &ch : normalized) {
            if (ch >= 'A' && ch <= 'Z') ch += 'a' - 'A';
          }
          if (source.empty() || normalized == "unknown" || normalized == "unavailable"
              || normalized == "none" || normalized == "null" || normalized == "n/a") {
            lv_label_set_text(id(media_source_label), "");
            lv_obj_add_flag(id(media_source_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(media_source_label), source.c_str());
            lv_obj_clear_flag(id(media_source_label), LV_OBJ_FLAG_HIDDEN);
          }

  - platform: template
    id: media_group_members_sensor
    on_value:
      - script.execute: update_group_members

  # Same discovery contract as the source project. The HA template sensor's
  # data attribute is ids|names|volumes[|manufacturers].
  - platform: homeassistant
    id: available_speakers_sensor
    entity_id: ${speaker_group_sensor}
    attribute: data
    on_value:
      - script.execute: parse_speakers

sensor:
  - platform: template
    id: media_duration_sensor
    on_value:
      - lambda: 'id(media_duration_value) = x > 0.0f ? x : 0.0f;'
      - script.execute: update_media_progress

  - platform: template
    id: media_position_sensor
    on_value:
      - lambda: |-
          id(media_base_position) = x > 0.0f ? x : 0.0f;
          id(media_position_millis) = millis();
      - script.execute: update_media_progress

  - platform: template
    id: media_volume_sensor
    on_value:
      - script.execute: reconcile_volume_feedback

interval:
  - interval: 1s
    then:
      - script.execute: update_media_progress
      - script.execute: reconcile_volume_feedback

script:
  - id: update_music_presets
    mode: restart
    then:
      - lambda: |-
          // Only these runtime names can be rendered because their glyphs are
          // compiled into icon_font. Unknown names safely use mdi:music.
          auto preset_icon = [](std::string name) -> const char * {
            const size_t first = name.find_first_not_of(" \t\r\n");
            if (first == std::string::npos) name.clear();
            else name = name.substr(first, name.find_last_not_of(" \t\r\n") - first + 1);
            for (char &ch : name) {
              if (ch >= 'A' && ch <= 'Z') ch += 'a' - 'A';
            }
            if (name == "mdi:playlist-music") return "\U000F0CB8";
            if (name == "mdi:weather-sunset-up") return "\U000F059C";
            if (name == "mdi:heart") return "\U000F02D1";
            if (name == "mdi:music-note") return "\U000F0387";
            if (name == "mdi:headphones") return "\U000F02CB";
            if (name == "mdi:coffee") return "\U000F0176";
            if (name == "mdi:weather-night") return "\U000F0594";
            return "\U000F075A";
          };
          if (id(music_preset_1_label) == nullptr) return;
          lv_label_set_text(id(music_preset_1_label), id(music_preset_1_name).state.empty() ? "Preset 1" : id(music_preset_1_name).state.c_str());
          lv_label_set_text(id(music_preset_1_icon_label), preset_icon(id(music_preset_1_icon).state));
          lv_label_set_text(id(music_preset_2_label), id(music_preset_2_name).state.empty() ? "Preset 2" : id(music_preset_2_name).state.c_str());
          lv_label_set_text(id(music_preset_2_icon_label), preset_icon(id(music_preset_2_icon).state));
          lv_label_set_text(id(music_preset_3_label), id(music_preset_3_name).state.empty() ? "Preset 3" : id(music_preset_3_name).state.c_str());
          lv_label_set_text(id(music_preset_3_icon_label), preset_icon(id(music_preset_3_icon).state));
          lv_label_set_text(id(music_preset_4_label), id(music_preset_4_name).state.empty() ? "Preset 4" : id(music_preset_4_name).state.c_str());
          lv_label_set_text(id(music_preset_4_icon_label), preset_icon(id(music_preset_4_icon).state));

  - id: play_music_preset
    mode: queued
    parameters:
      uri: string
    then:
      - if:
          condition:
            lambda: |-
              return id(media_player_entity).state.rfind("media_player.", 0) == 0
                  && !uri.empty();
          then:
            - homeassistant.service:
                service: music_assistant.play_media
                variables:
                  target: !lambda 'return id(media_player_entity).state;'
                  preset_uri: !lambda 'return uri;'
                data_template:
                  entity_id: "{{ target }}"
                  media_id: "{{ preset_uri }}"
                  media_type: playlist
                  enqueue: replace
          else:
            - logger.log:
                level: WARN
                tag: music_presets
                format: "Preset ignored: configure a URI and valid Media Player"

  - id: press_daily_briefing
    then:
      - event.trigger:
          id: daily_briefing_event
          event_type: pressed

  - id: stop_music
    then:
      - if:
          condition:
            lambda: 'return id(media_player_entity).state.rfind("media_player.", 0) == 0;'
          then:
            - homeassistant.service:
                service: media_player.media_stop
                variables:
                  target: !lambda 'return id(media_player_entity).state;'
                data_template:
                  entity_id: "{{ target }}"

  - id: subscribe_selected_media_player
    mode: restart
    then:
      - lambda: |-
          if (esphome::api::global_api_server == nullptr) return;
          std::string entity = id(media_player_entity).state;
          if (entity.empty() || entity.rfind("media_player.", 0) != 0) {
            id(media_subscription_generation)++;
            id(subscribed_media_entity) = "";
            if (!entity.empty()) ESP_LOGW("media", "Media Player must start with media_player.");
            return;
          }
          if (entity == id(subscribed_media_entity)) return;

          id(media_subscription_generation)++;
          id(subscribed_media_entity) = entity;
          id(media_last_artwork_url) = "";
          id(media_base_position) = 0.0f;
          id(media_duration_value) = 0.0f;
          id(media_position_millis) = millis();
          const int generation = id(media_subscription_generation);
          int *generation_ptr = &id(media_subscription_generation);
          auto *api_server = esphome::api::global_api_server;
          using state_cb = std::function<void(esphome::StringRef)>;

          auto sub_text = [&](const std::string &attribute, esphome::text_sensor::TextSensor *sensor) {
            api_server->subscribe_home_assistant_state(entity, esphome::optional<std::string>(attribute),
                state_cb([generation, generation_ptr, sensor](esphome::StringRef state) {
                  if (generation == *generation_ptr) sensor->publish_state(state.str());
                }));
          };
          auto sub_number = [&](const std::string &attribute, esphome::sensor::Sensor *sensor) {
            api_server->subscribe_home_assistant_state(entity, esphome::optional<std::string>(attribute),
                state_cb([generation, generation_ptr, sensor](esphome::StringRef state) {
                  if (generation != *generation_ptr) return;
                  auto parsed = esphome::parse_number<float>(state.str());
                  if (parsed.has_value()) sensor->publish_state(parsed.value());
                }));
          };

          sub_text("media_title", id(media_title_sensor));
          sub_text("media_artist", id(media_artist_sensor));
          sub_text("entity_picture", id(media_picture_sensor));
          sub_text("media_position_updated_at", id(media_position_updated_at_sensor));
          sub_text("source", id(media_source_sensor));
          sub_text("group_members", id(media_group_members_sensor));
          sub_number("media_duration", id(media_duration_sensor));
          sub_number("media_position", id(media_position_sensor));
          sub_number("volume_level", id(media_volume_sensor));
          api_server->subscribe_home_assistant_state(entity, esphome::optional<std::string>(""),
              state_cb([generation, generation_ptr](esphome::StringRef state) {
                if (generation == *generation_ptr) id(media_state_sensor).publish_state(state.str());
              }));
          ESP_LOGI("media", "Subscribed to %s", entity.c_str());

  - id: update_media_state
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(media_state_sensor).state == "playing";'
          then:
            - script.stop: return_to_weather_after_idle
            - if:
                condition:
                  lambda: 'return !id(media_was_playing);'
                then:
                  - logger.log:
                      level: WARN
                      tag: graphics_diag
                      format: "NOWPLAYING: transition starting"
                  - script.execute:
                      id: log_memory_diagnostics
                      reason: "now_playing_transition_starting"
            - lvgl.widget.hide: ambient_background
            - lvgl.widget.hide: display_time
            - lvgl.widget.hide: display_date
            - lvgl.widget.hide: weather_icon
            - lvgl.widget.hide: weather_temperature
            - lvgl.widget.hide: weather_condition
            - lvgl.widget.hide: ambient_navigation_button
            - lambda: 'lv_obj_clear_flag(id(ambient_navigation_button), LV_OBJ_FLAG_CLICKABLE);'
            - lvgl.widget.show: now_playing_view
            - lvgl.label.update:
                id: media_play_pause_icon
                text: "\U000F03E4"
            - if:
                condition:
                  lambda: 'return !id(media_was_playing);'
                then:
                  - lvgl.widget.hide: media_panel
                  - lvgl.page.show:
                      id: ambient_page
                      animation: FADE_IN
                  - logger.log:
                      level: WARN
                      tag: graphics_diag
                      format: "NOWPLAYING: transition finished"
                  - script.execute:
                      id: log_memory_diagnostics
                      reason: "now_playing_transition_finished"
            - lambda: 'id(media_was_playing) = true;'
            - script.execute: update_media_progress
          else:
            - lambda: 'id(media_was_playing) = false;'
            - lvgl.label.update:
                id: media_play_pause_icon
                text: "\U000F040A"
            - if:
                condition:
                  lambda: 'return id(media_state_sensor).state == "paused";'
                then:
                  # Keep artwork and context indefinitely while paused. The
                  # user's normal page navigation remains available by swipe.
                  - script.stop: return_to_weather_after_idle
                  - lvgl.widget.hide: ambient_background
                  - lvgl.widget.hide: display_time
                  - lvgl.widget.hide: display_date
                  - lvgl.widget.hide: weather_icon
                  - lvgl.widget.hide: weather_temperature
                  - lvgl.widget.hide: weather_condition
                  - lvgl.widget.hide: ambient_navigation_button
                  - lambda: 'lv_obj_clear_flag(id(ambient_navigation_button), LV_OBJ_FLAG_CLICKABLE);'
                  - lvgl.widget.show: now_playing_view
                else:
                  - script.execute: return_to_weather_after_idle

  - id: return_to_weather_after_idle
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            lambda: |-
              const std::string state = id(media_state_sensor).state;
              return state == "idle" || state == "off" || state == "standby"
                  || state == "unavailable" || state == "unknown" || state.empty();
          then:
            - lvgl.widget.hide: media_panel
            - lvgl.widget.hide: now_playing_view
            - lvgl.widget.show: ambient_background
            - lvgl.widget.show: display_time
            - lvgl.widget.show: display_date
            - lvgl.widget.show: weather_icon
            - lvgl.widget.show: weather_temperature
            - lvgl.widget.show: weather_condition
            - lambda: 'lv_obj_add_flag(id(ambient_navigation_button), LV_OBJ_FLAG_CLICKABLE);'
            - lvgl.widget.show: ambient_navigation_button

  - id: download_artwork
    mode: restart
    then:
      - delay: 250ms
      - logger.log:
          level: WARN
          tag: graphics_diag
          format: "ARTWORK: download starting"
      - script.execute:
          id: log_memory_diagnostics
          reason: "artwork_download_starting"
      - artwork_image.set_url:
          id: album_art_image
          url: !lambda 'return id(media_last_artwork_url);'
      - component.update: album_art_image

  - id: apply_downloaded_artwork
    mode: restart
    then:
      - lambda: 'id(artwork_retry_count) = 0;'
      - logger.log:
          level: WARN
          tag: graphics_diag
          format: "ARTWORK: LVGL image update starting"
      - script.execute:
          id: log_memory_diagnostics
          reason: "artwork_lvgl_update_starting"
      - lvgl.image.update:
          id: album_art_widget
          src: album_art_image
      - lvgl.widget.show: album_art_widget
      - logger.log:
          level: WARN
          tag: graphics_diag
          format: "ARTWORK: LVGL image update finished"
      - script.execute:
          id: log_memory_diagnostics
          reason: "artwork_lvgl_update_finished"

  - id: retry_artwork
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(media_last_artwork_url).empty() && id(artwork_retry_count) < 5;'
          then:
            - lambda: 'id(artwork_retry_count)++;'
            - delay: !lambda |-
                const uint32_t delays[] = {500, 1500, 3000, 6000, 10000};
                return delays[id(artwork_retry_count) - 1];
            - artwork_image.set_url:
                id: album_art_image
                url: !lambda 'return id(media_last_artwork_url);'
            - component.update: album_art_image
          else:
            - logger.log:
                level: WARN
                tag: media
                format: "Artwork retries exhausted; retaining the previous image"

  - id: update_media_progress
    mode: restart
    then:
      - lambda: |-
          float duration = id(media_duration_value);
          float position = id(media_base_position);
          if (id(media_state_sensor).has_state() && id(media_state_sensor).state == "playing") {
            position += (millis() - id(media_position_millis)) / 1000.0f;
          }
          if (position < 0.0f) position = 0.0f;
          if (duration > 0.0f && position > duration) position = duration;
          int value = duration > 0.0f ? (int) (position * 1000.0f / duration + 0.5f) : 0;
          lv_bar_set_value(id(media_progress_bar), value, LV_ANIM_OFF);
          auto format_time = [](int seconds) {
            char out[16];
            snprintf(out, sizeof(out), "%d:%02d", seconds / 60, seconds % 60);
            return std::string(out);
          };
          std::string label = format_time((int) position) + " / " + format_time((int) duration);
          lv_label_set_text(id(media_time_label), label.c_str());

  - id: media_play_pause
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          variables:
            target: !lambda 'return id(media_player_entity).state;'
          data_template:
            entity_id: "{{ target }}"

  - id: media_previous
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          variables:
            target: !lambda 'return id(media_player_entity).state;'
          data_template:
            entity_id: "{{ target }}"

  - id: media_next
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          variables:
            target: !lambda 'return id(media_player_entity).state;'
          data_template:
            entity_id: "{{ target }}"

  - id: show_media_panel
    then:
      - lambda: 'id(speaker_page) = 0;'
      - script.execute: reconcile_volume_feedback
      - lvgl.widget.hide: ambient_navigation_button
      - lvgl.widget.show: media_panel
      - lambda: 'lv_obj_move_foreground(id(media_panel));'

  - id: hide_media_panel
    then:
      - lvgl.widget.hide: media_panel

  - id: change_main_volume
    mode: restart
    parameters:
      direction: int
    then:
      - script.execute:
          id: set_player_volume
          target: !lambda 'return id(media_player_entity).state;'
          level: !lambda 'return id(media_volume_value) + direction * 0.05f;'

  # Capture each target/level in script parameters, so group and individual
  # presses cannot overwrite one another through shared service globals.
  - id: send_volume_level
    mode: queued
    parameters:
      target: string
      level: float
    then:
      - homeassistant.service:
          service: media_player.volume_set
          variables:
            request_target: !lambda 'return target;'
            request_level: !lambda 'return level;'
          data_template:
            entity_id: "{{ request_target }}"
            volume_level: "{{ request_level }}"

  - id: set_player_volume
    mode: queued
    parameters:
      target: string
      level: float
    then:
      - if:
          condition:
            lambda: 'return target.rfind("media_player.", 0) == 0 && std::isfinite(level);'
          then:
            - lambda: |-
                if (level < 0.0f) level = 0.0f;
                if (level > 1.0f) level = 1.0f;
                const int pct = (int) (level * 100.0f + 0.5f);
                level = pct / 100.0f;
                const uint32_t until = millis() + 1500;
                if (target == id(media_player_entity).state) {
                  id(media_volume_value) = level;
                  id(media_volume_pending_pct) = pct;
                  id(media_volume_pending_until) = until;
                }
                for (int i = 0; i < id(speaker_count); i++) {
                  if (id(speaker_entity_ids)[i] != target) continue;
                  id(speaker_volumes)[i] = level;
                  id(speaker_volume_pending_pct)[i] = pct;
                  id(speaker_volume_pending_until)[i] = until;
                }
                id(refresh_speaker_panel).execute();
            - script.execute:
                id: send_volume_level
                target: !lambda 'return target;'
                level: !lambda 'return level < 0.0f ? 0.0f : level > 1.0f ? 1.0f : ((int) (level * 100.0f + 0.5f)) / 100.0f;'

  # HA remains authoritative after the 1.5 s optimistic window. Reconcile on
  # every HA update and on the timer, even if no new echo arrives after expiry.
  - id: reconcile_volume_feedback
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(media_volume_sensor).has_state() && std::isfinite(id(media_volume_sensor).state)) {
            float value = id(media_volume_sensor).state;
            if (value < 0.0f) value = 0.0f;
            if (value > 1.0f) value = 1.0f;
            const int incoming = (int) (value * 100.0f + 0.5f);
            if (id(media_volume_pending_pct) >= 0
                && (int32_t) (id(media_volume_pending_until) - now) > 0
                && incoming != id(media_volume_pending_pct)) {
              ESP_LOGD("media", "Ignoring stale volume echo %d%%", incoming);
            } else {
              id(media_volume_pending_pct) = -1;
              id(media_volume_pending_until) = 0;
              id(media_volume_value) = value;
            }
          }
          for (int i = 0; i < id(speaker_count); i++) {
            if (id(speaker_entity_ids)[i] == id(media_player_entity).state) {
              id(speaker_volumes)[i] = id(media_volume_value);
              continue;
            }
            const float reported = id(speaker_reported_volumes)[i];
            const int incoming = (int) (reported * 100.0f + 0.5f);
            if (id(speaker_volume_pending_pct)[i] >= 0
                && (int32_t) (id(speaker_volume_pending_until)[i] - now) > 0
                && incoming != id(speaker_volume_pending_pct)[i]) continue;
            id(speaker_volume_pending_pct)[i] = -1;
            id(speaker_volume_pending_until)[i] = 0;
            id(speaker_volumes)[i] = reported;
          }
      - script.execute: refresh_speaker_panel

  - id: parse_speakers
    mode: restart
    then:
      - lambda: |-
          std::string raw = id(available_speakers_sensor).has_state()
              ? id(available_speakers_sensor).state : "";
          auto split = [](const std::string &value, char delimiter, size_t limit) {
            std::vector<std::string> result;
            size_t start = 0;
            while (start <= value.size() && result.size() < limit) {
              size_t end = value.find(delimiter, start);
              std::string item = value.substr(start, end == std::string::npos ? std::string::npos : end - start);
              while (!item.empty() && item.front() == ' ') item.erase(0, 1);
              while (!item.empty() && item.back() == ' ') item.pop_back();
              result.push_back(item);
              if (end == std::string::npos) break;
              start = end + 1;
            }
            return result;
          };
          auto sections = split(raw, '|', 4);
          auto ids = sections.size() > 0 ? split(sections[0], ',', 16) : std::vector<std::string>{};
          auto names = sections.size() > 1 ? split(sections[1], ',', 16) : std::vector<std::string>{};
          auto volumes = sections.size() > 2 ? split(sections[2], ',', 16) : std::vector<std::string>{};
          auto manufacturers = sections.size() > 3 ? split(sections[3], ',', 16) : std::vector<std::string>{};
          // Preserve optimistic state by entity, even when discovery reorders.
          std::string old_ids[6];
          float old_volumes[6], old_reported[6];
          int old_pending[6];
          uint32_t old_until[6];
          for (int i = 0; i < 6; i++) {
            old_ids[i] = id(speaker_entity_ids)[i];
            old_volumes[i] = id(speaker_volumes)[i];
            old_reported[i] = id(speaker_reported_volumes)[i];
            old_pending[i] = id(speaker_volume_pending_pct)[i];
            old_until[i] = id(speaker_volume_pending_until)[i];
            id(speaker_entity_ids)[i] = "";
            id(speaker_names)[i] = "";
            id(speaker_volumes)[i] = 0.0f;
            id(speaker_reported_volumes)[i] = 0.0f;
            id(speaker_volume_pending_pct)[i] = -1;
            id(speaker_volume_pending_until)[i] = 0;
            id(speaker_grouped)[i] = false;
          }
          id(speaker_count) = 0;
          const std::string selected = id(media_player_entity).state;
          int selected_source_index = -1;
          for (size_t i = 0; i < ids.size(); i++) {
            if (ids[i].empty() || ids[i] == "unknown" || ids[i] == "unavailable" || ids[i] == "None") {
              ids[i] = "";
              continue;
            }
            if (ids[i].rfind("media_player.", 0) != 0) ids[i] = "media_player." + ids[i];
            if (ids[i] == selected) selected_source_index = (int) i;
          }
          std::string selected_manufacturer;
          if (selected_source_index >= 0 && selected_source_index < (int) manufacturers.size()) {
            selected_manufacturer = manufacturers[selected_source_index];
          }
          auto add_speaker = [&](int source_index) {
            if (source_index < 0 || source_index >= (int) ids.size()
                || ids[source_index].empty() || id(speaker_count) >= 6) return;
            if (!selected_manufacturer.empty() && source_index < (int) manufacturers.size()
                && !manufacturers[source_index].empty()
                && manufacturers[source_index] != selected_manufacturer) return;
            for (int i = 0; i < id(speaker_count); i++) {
              if (id(speaker_entity_ids)[i] == ids[source_index]) return;
            }
            const int slot = id(speaker_count)++;
            id(speaker_entity_ids)[slot] = ids[source_index];
            id(speaker_names)[slot] = source_index < (int) names.size() && !names[source_index].empty()
                ? names[source_index] : ids[source_index];
            for (int old = 0; old < 6; old++) {
              if (old_ids[old] != ids[source_index]) continue;
              id(speaker_volumes)[slot] = old_volumes[old];
              id(speaker_reported_volumes)[slot] = old_reported[old];
              id(speaker_volume_pending_pct)[slot] = old_pending[old];
              id(speaker_volume_pending_until)[slot] = old_until[old];
              break;
            }
            if (source_index < (int) volumes.size()) {
              auto parsed = esphome::parse_number<float>(volumes[source_index]);
              if (parsed.has_value() && std::isfinite(parsed.value())) {
                float value = parsed.value();
                if (value < 0.0f) value = 0.0f;
                if (value > 1.0f) value = 1.0f;
                id(speaker_reported_volumes)[slot] = value;
              }
            }
          };
          if (selected_source_index >= 0) {
            add_speaker(selected_source_index);
          } else if (selected.rfind("media_player.", 0) == 0) {
            // Always reserve the leader slot, even if discovery omits it.
            id(speaker_count) = 1;
            id(speaker_entity_ids)[0] = selected;
            id(speaker_names)[0] = "Selected player";
            id(speaker_volumes)[0] = id(media_volume_value);
            id(speaker_reported_volumes)[0] = id(media_volume_value);
          }
          for (size_t i = 0; i < ids.size() && id(speaker_count) < 6; i++) {
            if ((int) i != selected_source_index) add_speaker((int) i);
          }
      - script.execute: update_group_members
      - script.execute: reconcile_volume_feedback

  - id: update_group_members
    mode: restart
    then:
      - lambda: |-
          const std::string members = id(media_group_members_sensor).has_state()
              ? id(media_group_members_sensor).state : "";
          // Match complete entity IDs (room must not match room_2).
          std::string normalized = ",";
          for (char ch : members) {
            if (ch != '[' && ch != ']' && ch != '\'' && ch != '"' && ch != ' ') normalized += ch;
          }
          normalized += ",";
          for (int i = 0; i < id(speaker_count); i++) {
            const std::string entity = id(speaker_entity_ids)[i];
            id(speaker_grouped)[i] = entity == id(media_player_entity).state
                || normalized.find("," + entity + ",") != std::string::npos;
          }
      - script.execute: refresh_speaker_panel

  - id: refresh_speaker_panel
    mode: restart
    then:
      - lambda: |-
          // Restored settings / HA callbacks can arrive before LVGL is ready.
          if (id(main_volume_label) == nullptr) return;
          lv_obj_t *rows[] = {id(speaker_row_0), id(speaker_row_1), id(speaker_row_2), id(speaker_row_3), id(speaker_row_4), id(speaker_row_5)};
          lv_obj_t *names[] = {id(speaker_name_0), id(speaker_name_1), id(speaker_name_2), id(speaker_name_3), id(speaker_name_4), id(speaker_name_5)};
          lv_obj_t *volumes[] = {id(speaker_volume_0), id(speaker_volume_1), id(speaker_volume_2), id(speaker_volume_3), id(speaker_volume_4), id(speaker_volume_5)};
          lv_obj_t *toggles[] = {id(speaker_group_button_0), id(speaker_group_button_1), id(speaker_group_button_2), id(speaker_group_button_3), id(speaker_group_button_4), id(speaker_group_button_5)};
          lv_obj_t *toggle_labels[] = {id(speaker_group_label_0), id(speaker_group_label_1), id(speaker_group_label_2), id(speaker_group_label_3), id(speaker_group_label_4), id(speaker_group_label_5)};
          const int pages = id(speaker_count) > 0 ? (id(speaker_count) + 1) / 2 : 1;
          if (id(speaker_page) >= pages) id(speaker_page) = pages - 1;
          if (id(speaker_page) < 0) id(speaker_page) = 0;
          for (int i = 0; i < 6; i++) {
            if (i >= id(speaker_count) || i / 2 != id(speaker_page)) {
              lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(names[i], id(speaker_names)[i].c_str());
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", (int) (id(speaker_volumes)[i] * 100.0f + 0.5f));
            lv_label_set_text(volumes[i], buf);
            const bool leader = id(speaker_entity_ids)[i] == id(media_player_entity).state;
            lv_label_set_text(toggle_labels[i], leader ? "Main" : id(speaker_grouped)[i] ? "Leave" : "Join");
            if (leader) lv_obj_add_state(toggles[i], LV_STATE_DISABLED);
            else lv_obj_clear_state(toggles[i], LV_STATE_DISABLED);
            lv_obj_set_style_bg_color(rows[i], lv_color_hex(id(speaker_grouped)[i] ? 0x263548 : 0x171B20), 0);
          }
          char main_buf[8];
          snprintf(main_buf, sizeof(main_buf), "%d%%", (int) (id(media_volume_value) * 100.0f + 0.5f));
          lv_label_set_text(id(main_volume_label), main_buf);
          int grouped = 0;
          float total = 0.0f;
          for (int i = 0; i < id(speaker_count); i++) {
            if (id(speaker_grouped)[i]) { grouped++; total += id(speaker_volumes)[i]; }
          }
          char group_buf[8];
          snprintf(group_buf, sizeof(group_buf), "%d%%", grouped ? (int) (total * 100.0f / grouped + 0.5f) : 0);
          lv_label_set_text(id(group_volume_label), group_buf);
          char page_buf[40];
          if (id(speaker_count) == 0) snprintf(page_buf, sizeof(page_buf), "No speakers");
          else snprintf(page_buf, sizeof(page_buf), "%d-%d of %d", id(speaker_page) * 2 + 1,
              std::min(id(speaker_page) * 2 + 2, id(speaker_count)), id(speaker_count));
          lv_label_set_text(id(speaker_page_label), page_buf);
          if (id(speaker_page) == 0) lv_obj_add_state(id(speaker_page_previous), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(speaker_page_previous), LV_STATE_DISABLED);
          if (id(speaker_page) == pages - 1) lv_obj_add_state(id(speaker_page_next), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(speaker_page_next), LV_STATE_DISABLED);

  - id: change_speaker_page
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: 'id(speaker_page) += direction;'
      - script.execute: refresh_speaker_panel

  - id: toggle_speaker_group
    mode: single
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: 'return slot >= 0 && slot < id(speaker_count) && id(speaker_entity_ids)[slot] != id(media_player_entity).state;'
          then:
            - if:
                condition:
                  lambda: 'return id(speaker_grouped)[slot];'
                then:
                  - homeassistant.service:
                      service: media_player.unjoin
                      variables:
                        target: !lambda 'return id(speaker_entity_ids)[slot];'
                      data_template:
                        entity_id: "{{ target }}"
                else:
                  - homeassistant.service:
                      service: media_player.join
                      variables:
                        target: !lambda 'return id(media_player_entity).state;'
                        member: !lambda 'return id(speaker_entity_ids)[slot];'
                      data_template:
                        entity_id: "{{ target }}"
                        group_members: "{{ member }}"

  - id: change_speaker_volume
    mode: restart
    parameters:
      slot: int
      direction: int
    then:
      - if:
          condition:
            lambda: 'return slot >= 0 && slot < id(speaker_count);'
          then:
            - script.execute:
                id: set_player_volume
                target: !lambda 'return id(speaker_entity_ids)[slot];'
                level: !lambda 'return id(speaker_volumes)[slot] + direction * 0.05f;'

  - id: group_volume_up
    then:
      - script.execute:
          id: change_group_volume
          direction: 1

  - id: group_volume_down
    then:
      - script.execute:
          id: change_group_volume
          direction: -1

  # Finish every group press before starting the next; rapid taps must not
  # restart halfway through the group and adjust only the first few speakers.
  - id: change_group_volume
    mode: queued
    max_runs: 20
    parameters:
      direction: int
    then:
      - lambda: 'id(group_volume_index) = 0;'
      - while:
          condition:
            lambda: |-
              while (id(group_volume_index) < id(speaker_count)
                     && !id(speaker_grouped)[id(group_volume_index)]) id(group_volume_index)++;
              return id(group_volume_index) < id(speaker_count);
          then:
            - script.execute:
                id: change_speaker_volume
                slot: !lambda 'return id(group_volume_index)++;'
                direction: !lambda 'return direction;'
            - delay: 150ms

