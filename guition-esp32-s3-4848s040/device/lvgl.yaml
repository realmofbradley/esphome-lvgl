lvgl:
  bg_color: 0x0F1115

  page_wrap: true

  pages:

    # ==========================================================
    # PAGE 1 — AMBIENT
    # ==========================================================
    - id: ambient_page
      bg_color: 0x18202A

      on_swipe_left:
        - lvgl.page.next:

      widgets:

        - image:
            id: ambient_background
            align: CENTER
            src: ambient_background_image

        # The weather view remains the idle face. The media package hides this
        # container while playback (or a short paused grace period) is active.
        - obj:
            id: ambient_weather_view
            width: 480
            height: 480
            bg_opa: TRANSP
            border_width: 0
            clickable: false

        - label:
            id: display_time
            align: TOP_MID
            y: 35
            text: "--:--"
            text_font: roboto72_font
            text_color: 0xFFFFFF

        - label:
            id: display_date
            align: TOP_MID
            y: 118
            text: "Friday, October 9"
            text_font: roboto24_font
            text_color: 0xD7DCE2

        - image:
            id: weather_icon
            align: CENTER
            x: -95
            y: 30
            src: weather_partly_cloudy_day

        - label:
            id: weather_temperature
            align: CENTER
            x: 65
            y: 20
            text: "12°"
            text_font: roboto48_font
            text_color: 0xFFFFFF

        - label:
            id: weather_condition
            align: CENTER
            x: 70
            y: 68
            text: "Partly Cloudy"
            text_font: roboto20_font
            text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            y: -38
            width: 360
            height: 68
            radius: 24
            bg_color: 0x242C36
            bg_opa: 85%
            border_width: 1
            border_color: 0x394451

            widgets:
              - label:
                  align: LEFT_MID
                  x: 24
                  text: "Bathroom"
                  text_font: roboto20_font
                  text_color: 0xFFFFFF

              - label:
                  id: bathroom_climate
                  align: RIGHT_MID
                  x: -24
                  text: "--.-°  ·  --%"
                  text_font: roboto20_font
                  text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            x: -20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFFFFF
            border_width: 0

        - obj:
            align: BOTTOM_MID
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - obj:
            align: BOTTOM_MID
            x: 20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - button:
            id: ambient_navigation_button
            align: CENTER
            width: 480
            height: 480
            bg_opa: TRANSP
            border_opa: TRANSP
            shadow_opa: TRANSP

            on_click:
              - lvgl.page.show:
                  id: controls_page
                  animation: MOVE_LEFT

        # Full-screen media layer. Artwork and state are supplied by
        # device/media.yaml; it deliberately lives on the ambient page so the
        # existing swipe order (ambient -> controls -> presets) is unchanged.
        - obj:
            id: now_playing_view
            width: 480
            height: 480
            bg_color: 0x08090B
            border_width: 0
            hidden: true
            clickable: false

            widgets:
              - image:
                  id: album_art_widget
                  align: CENTER
                  src: album_art_image
                  width: 480
                  height: 480

              - obj:
                  align: BOTTOM_MID
                  width: 480
                  height: 190
                  bg_color: 0x08090B
                  bg_opa: 82%
                  border_width: 0
                  clickable: false

                  widgets:
                    - label:
                        id: media_title_label
                        align: TOP_MID
                        y: 12
                        width: 410
                        text: "--"
                        text_align: CENTER
                        long_mode: DOT
                        text_font: roboto24_font
                        text_color: 0xFFFFFF

                    - label:
                        id: media_artist_label
                        align: TOP_MID
                        y: 45
                        width: 390
                        text: ""
                        text_align: CENTER
                        long_mode: DOT
                        text_font: roboto18_font
                        text_color: 0xCDD3DB

                    - bar:
                        id: media_progress_bar
                        align: TOP_MID
                        y: 77
                        width: 390
                        height: 6
                        min_value: 0
                        max_value: 1000
                        value: 0
                        bg_color: 0x525B66
                        indicator:
                          bg_color: 0xFFFFFF

                    - label:
                        id: media_time_label
                        align: TOP_MID
                        y: 88
                        text: "0:00 / 0:00"
                        text_font: roboto15_font
                        text_color: 0xAEB7C2

                    - button:
                        id: media_previous_button
                        align: BOTTOM_MID
                        x: -105
                        y: -12
                        width: 58
                        height: 58
                        radius: 29
                        bg_color: 0x252A31
                        on_click:
                          - script.execute: media_previous
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F04AE"
                              text_font: icon_font

                    - button:
                        id: media_play_pause_button
                        align: BOTTOM_MID
                        y: -7
                        width: 70
                        height: 70
                        radius: 35
                        bg_color: 0xFFFFFF
                        on_click:
                          - script.execute: media_play_pause
                        widgets:
                          - label:
                              id: media_play_pause_icon
                              align: CENTER
                              text: "\U000F040A"
                              text_font: icon_font
                              text_color: 0x111318

                    - button:
                        id: media_next_button
                        align: BOTTOM_MID
                        x: 105
                        y: -12
                        width: 58
                        height: 58
                        radius: 29
                        bg_color: 0x252A31
                        on_click:
                          - script.execute: media_next
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F04AD"
                              text_font: icon_font

              - button:
                  id: media_volume_button
                  align: TOP_RIGHT
                  x: -15
                  y: 15
                  width: 58
                  height: 58
                  radius: 29
                  bg_color: 0x111318
                  bg_opa: 78%
                  on_click:
                    - script.execute: show_media_panel
                  widgets:
                    - label:
                        align: CENTER
                        text: "\U000F057E"
                        text_font: icon_font

              - label:
                  id: media_source_label
                  align: TOP_LEFT
                  x: 16
                  y: 18
                  text: ""
                  text_font: roboto16_font
                  text_color: 0xFFFFFF
                  bg_color: 0x111318
                  bg_opa: 70%
                  pad_left: 10
                  pad_right: 10
                  pad_top: 6
                  pad_bottom: 6

        # Volume and grouping panel. Six speaker slots cover the common room
        # setup while keeping each row usable on a 480 px display.
        - obj:
            id: media_panel
            width: 480
            height: 480
            bg_color: 0x101318
            border_width: 0
            hidden: true

            widgets:
              - label:
                  x: 24
                  y: 20
                  text: "Volume & speakers"
                  text_font: roboto28_font
                  text_color: 0xFFFFFF

              - button:
                  align: TOP_RIGHT
                  x: -18
                  y: 14
                  width: 54
                  height: 54
                  radius: 27
                  bg_color: 0x252A31
                  on_click:
                    - script.execute: hide_media_panel
                  widgets:
                    - label:
                        align: CENTER
                        text: "\U000F0156"
                        text_font: icon_font

              - obj:
                  x: 24
                  y: 82
                  width: 432
                  height: 66
                  radius: 18
                  bg_color: 0x1D232B
                  border_width: 1
                  border_color: 0x323B46
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 16
                        text: "Main"
                        text_font: roboto20_font
                    - button:
                        align: RIGHT_MID
                        x: -112
                        width: 48
                        height: 44
                        radius: 18
                        bg_color: 0x303842
                        on_click:
                          - script.execute:
                              id: change_main_volume
                              direction: -1
                        widgets:
                          - label: { align: CENTER, text: "-", text_font: roboto28_font }
                    - label:
                        id: main_volume_label
                        align: RIGHT_MID
                        x: -63
                        width: 58
                        text: "--%"
                        text_align: CENTER
                        text_font: roboto18_font
                    - button:
                        align: RIGHT_MID
                        x: -8
                        width: 48
                        height: 44
                        radius: 18
                        bg_color: 0x303842
                        on_click:
                          - script.execute:
                              id: change_main_volume
                              direction: 1
                        widgets:
                          - label: { align: CENTER, text: "+", text_font: roboto28_font }

              - obj:
                  id: group_volume_card
                  x: 24
                  y: 156
                  width: 432
                  height: 54
                  radius: 16
                  bg_color: 0x19202A
                  border_width: 1
                  border_color: 0x344252
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 16
                        text: "Group"
                        text_font: roboto18_font
                    - button:
                        align: RIGHT_MID
                        x: -112
                        width: 44
                        height: 38
                        radius: 15
                        bg_color: 0x303842
                        on_click:
                          - script.execute: group_volume_down
                        widgets:
                          - label: { align: CENTER, text: "-", text_font: roboto24_font }
                    - label:
                        id: group_volume_label
                        align: RIGHT_MID
                        x: -63
                        width: 58
                        text: "--%"
                        text_align: CENTER
                        text_font: roboto18_font
                    - button:
                        align: RIGHT_MID
                        x: -8
                        width: 44
                        height: 38
                        radius: 15
                        bg_color: 0x303842
                        on_click:
                          - script.execute: group_volume_up
                        widgets:
                          - label: { align: CENTER, text: "+", text_font: roboto24_font }

              - obj:
                  id: speakers_container
                  x: 24
                  y: 218
                  width: 432
                  height: 244
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_row: 6

                  widgets:
                    - obj: &speaker_row
                        id: speaker_row_0
                        width: 424
                        height: 35
                        radius: 12
                        bg_color: 0x212832
                        border_width: 0
                        widgets:
                          - label: { id: speaker_name_0, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 0, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_0, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 0, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }
                    - obj:
                        <<: *speaker_row
                        id: speaker_row_1
                        on_click: [{ script.execute: { id: toggle_speaker_group, slot: 1 } }]
                        widgets:
                          - label: { id: speaker_name_1, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 1, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_1, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 1, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }
                    - obj:
                        <<: *speaker_row
                        id: speaker_row_2
                        on_click: [{ script.execute: { id: toggle_speaker_group, slot: 2 } }]
                        widgets:
                          - label: { id: speaker_name_2, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 2, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_2, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 2, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }
                    - obj:
                        <<: *speaker_row
                        id: speaker_row_3
                        on_click: [{ script.execute: { id: toggle_speaker_group, slot: 3 } }]
                        widgets:
                          - label: { id: speaker_name_3, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 3, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_3, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 3, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }
                    - obj:
                        <<: *speaker_row
                        id: speaker_row_4
                        on_click: [{ script.execute: { id: toggle_speaker_group, slot: 4 } }]
                        widgets:
                          - label: { id: speaker_name_4, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 4, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_4, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 4, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }
                    - obj:
                        <<: *speaker_row
                        id: speaker_row_5
                        on_click: [{ script.execute: { id: toggle_speaker_group, slot: 5 } }]
                        widgets:
                          - label: { id: speaker_name_5, align: LEFT_MID, x: 10, width: 188, long_mode: DOT, text: "", text_font: roboto16_font }
                          - button: { align: RIGHT_MID, x: -105, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 5, direction: -1 } }], widgets: [{ label: { align: CENTER, text: "-", text_font: roboto20_font } }] }
                          - label: { id: speaker_volume_5, align: RIGHT_MID, x: -67, width: 44, text: "--%", text_align: CENTER, text_font: roboto15_font }
                          - button: { align: RIGHT_MID, x: -31, width: 34, height: 29, radius: 12, bg_color: 0x303842, on_click: [{ script.execute: { id: change_speaker_volume, slot: 5, direction: 1 } }], widgets: [{ label: { align: CENTER, text: "+", text_font: roboto20_font } }] }


    # ==========================================================
    # PAGE 2 — BATHROOM CONTROLS
    # ==========================================================
    - id: controls_page
      bg_color: 0x101318

      on_swipe_right:
        - lvgl.page.previous:

      on_swipe_left:
        - lvgl.page.next:

      widgets:

        - label:
            align: TOP_LEFT
            x: 28
            y: 25
            text: "Bathroom"
            text_font: roboto36_font
            text_color: 0xFFFFFF

        - label:
            align: TOP_RIGHT
            x: -28
            y: 34
            text: "22.4°  47%"
            text_font: roboto20_font
            text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Lights
        # ------------------------------------------------------
        - button:
            id: bathroom_light_button
            x: 28
            y: 105
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0335"
                  text_font: icon_font
                  text_color: 0xFFD166

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Lights"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "On"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Fan
        # ------------------------------------------------------
        - button:
            id: bathroom_fan_button
            x: 250
            y: 105
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0210"
                  text_font: icon_font
                  text_color: 0x7DD3FC

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Fan"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Auto"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Night
        # ------------------------------------------------------
        - button:
            id: bathroom_night_button
            x: 28
            y: 260
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0594"
                  text_font: icon_font
                  text_color: 0xC4B5FD

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Night"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Scene"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Heat
        # ------------------------------------------------------
        - button:
            id: bathroom_heat_button
            x: 250
            y: 260
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0438"
                  text_font: icon_font
                  text_color: 0xFB923C

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Heat"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Off"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0
        - obj:
            align: BOTTOM_MID
            x: -20
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - obj:
            align: BOTTOM_MID
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFFFFF
            border_width: 0

        - obj:
            align: BOTTOM_MID
            x: 20
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0


    # ==========================================================
    # PAGE 3 — MUSIC AUTOMATIONS
    # ==========================================================
    - id: music_page
      bg_color: 0x101318

      on_swipe_right:
        - lvgl.page.previous:

      widgets:

        - label:
            align: TOP_LEFT
            x: 28
            y: 25
            text: "Music"
            text_font: roboto36_font
            text_color: 0xFFFFFF

        - label:
            align: TOP_LEFT
            x: 29
            y: 70
            text: "Bathroom presets"
            text_font: roboto18_font
            text_color: 0x8E99A6

        # ------------------------------------------------------
        # Morning
        # ------------------------------------------------------
        - button:
            x: 28
            y: 120
            width: 424
            height: 72
            radius: 22
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: LEFT_MID
                  x: 22
                  text: "\U000F075A"
                  text_font: icon_font
                  text_color: 0xFFD166

              - label:
                  align: LEFT_MID
                  x: 78
                  text: "Morning"
                  text_font: roboto22_font
                  text_color: 0xFFFFFF

        # ------------------------------------------------------
        # Relax
        # ------------------------------------------------------
        - button:
            x: 28
            y: 208
            width: 424
            height: 72
            radius: 22
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: LEFT_MID
                  x: 22
                  text: "\U000F0E02"
                  text_font: icon_font
                  text_color: 0xC4B5FD

              - label:
                  align: LEFT_MID
                  x: 78
                  text: "Relax"
                  text_font: roboto22_font
                  text_color: 0xFFFFFF

        # ------------------------------------------------------
        # Favourites
        # ------------------------------------------------------
        - button:
            x: 28
            y: 296
            width: 424
            height: 72
            radius: 22
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: LEFT_MID
                  x: 22
                  text: "\U000F02D1"
                  text_font: icon_font
                  text_color: 0xF472B6

              - label:
                  align: LEFT_MID
                  x: 78
                  text: "Bathroom Favourites"
                  text_font: roboto22_font
                  text_color: 0xFFFFFF

        # ------------------------------------------------------
        # Stop Music
        # ------------------------------------------------------
        - button:
            x: 28
            y: 384
            width: 424
            height: 60
            radius: 22
            bg_color: 0x261D20
            border_width: 1
            border_color: 0x56353D
            shadow_width: 0

            widgets:
