lvgl:
  displays:
    - tft_display

  touchscreens:
    - touchscreen_id: tft_touch

  bg_color: 0x121212

  pages:
    - id: main_page
      widgets:
        - label:
            id: display_time
            align: TOP_MID
            y: 45
            text: "--:--"
            text_font: roboto72_font
            text_color: 0xFFFFFF

        - label:
            align: CENTER
            y: 25
            text: "Bathroom"
            text_font: roboto36_font
            text_color: 0xFFFFFF

        - button:
            id: test_button
            align: BOTTOM_MID
            y: -45
            width: 220
            height: 90
            widgets:
              - label:
                  align: CENTER
                  text: "Touch Test"
            on_click:
              - logger.log: "Bathroom display button pressed"
