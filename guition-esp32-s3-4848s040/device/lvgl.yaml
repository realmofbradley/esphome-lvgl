        # ------------------------------------------------------
        # Lights
        # ------------------------------------------------------
        - button:
            id: bathroom_light_button
            x: 28
            y: 105
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0
            scrollable: false
            scrollbar_mode: "off"
            on_click:
              - if:
                  condition:
                    lambda: 'return (uint32_t) (millis() - id(bathroom_controls_last_swipe)) >= 350;'
                  then:
                    - script.execute: toggle_bathroom_light

