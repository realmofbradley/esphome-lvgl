lvgl:
  bg_color: 0x0F1115

  page_wrap: true

  pages:

    # ==========================================================
    # PAGE 1 — AMBIENT
    # ==========================================================
    - id: ambient_page
      bg_color: 0x18202A
      pad_all: 0
      scrollable: false
      scrollbar_mode: "off"

      on_swipe_left:
        - lvgl.page.next:

      widgets:

        - image:
            id: ambient_background
            align: CENTER
            src: ambient_background_image

        - label:
            id: display_time
            align: TOP_MID
            y: 35
            text: "--:--"
            text_font: roboto72_font
            text_color: 0xFFFFFF

        - label:
            id: display_date
            align: TOP_MID
            y: 118
            text: "Friday, October 9"
            text_font: roboto24_font
            text_color: 0xD7DCE2

        - image:
            id: weather_icon
            align: CENTER
            x: -95
            y: 30
            src: weather_partly_cloudy_day

        - label:
            id: weather_temperature
            align: CENTER
            x: 65
            y: 20
            text: "12°"
            text_font: roboto48_font
            text_color: 0xFFFFFF

        - label:
            id: weather_condition
            align: CENTER
            x: 70
            y: 68
            text: "Partly Cloudy"
            text_font: roboto20_font
            text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            y: -38
            width: 360
            height: 68
            radius: 24
            bg_color: 0x242C36
            bg_opa: 85%
            border_width: 1
            border_color: 0x394451

            widgets:
              - label:
                  align: LEFT_MID
                  x: 24
                  text: "Bathroom"
                  text_font: roboto20_font
                  text_color: 0xFFFFFF

              - label:
                  id: bathroom_climate
                  align: RIGHT_MID
                  x: -24
                  text: "--.-°  ·  --%"
                  text_font: roboto20_font
                  text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            x: -20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFFFFF
            border_width: 0

        - obj:
            align: BOTTOM_MID
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - obj:
            align: BOTTOM_MID
            x: 20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - button:
            id: ambient_navigation_button
            pad_all: 0
            scrollable: false
            scrollbar_mode: "off"
            align: CENTER
            width: 480
            height: 480
            bg_opa: TRANSP
            border_opa: TRANSP
            shadow_opa: TRANSP

            on_click:
              - lvgl.page.show:
                  id: controls_page
                  animation: MOVE_LEFT

        # Full-screen media layers stay above ambient navigation.
        - obj:
            pad_all: 0
            scrollable: false
            scrollbar_mode: "off"
            border_width: 0
            clickable: true
            id: now_playing_view
            x: 0
            y: 0
            width: 480
            height: 480
            radius: 0
            bg_color: 0x08090B
            hidden: true
            gesture_bubble: true
