lvgl:
  bg_color: 0x0F1115

  page_wrap: true

  pages:

    # ==========================================================
    # PAGE 1 — AMBIENT
    # ==========================================================
    - id: ambient_page
      bg_color: 0x18202A

      on_swipe_left:
        - lvgl.page.next:

      widgets:

        - image:
            id: ambient_background
            align: CENTER
            src: ambient_background_clear_day

        - label:
            id: display_time
            align: TOP_MID
            y: 35
            text: "--:--"
            text_font: roboto72_font
            text_color: 0xFFFFFF

        - label:
            id: display_date
            align: TOP_MID
            y: 118
            text: "Friday, October 9"
            text_font: roboto24_font
            text_color: 0xD7DCE2

        - image:
            id: weather_icon
            align: CENTER
            x: -95
            y: 30
            src: weather_partly_cloudy_day

        - label:
            id: weather_temperature
            align: CENTER
            x: 65
            y: 20
            text: "12°"
            text_font: roboto48_font
            text_color: 0xFFFFFF

        - label:
            id: weather_condition
            align: CENTER
            x: 70
            y: 68
            text: "Partly Cloudy"
            text_font: roboto20_font
            text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            y: -38
            width: 360
            height: 68
            radius: 24
            bg_color: 0x242C36
            bg_opa: 85%
            border_width: 1
            border_color: 0x394451

            widgets:
              - label:
                  align: LEFT_MID
                  x: 24
                  text: "Bathroom"
                  text_font: roboto20_font
                  text_color: 0xFFFFFF

              - label:
                  id: bathroom_climate
                  align: RIGHT_MID
                  x: -24
                  text: "--.-°  ·  --%"
                  text_font: roboto20_font
                  text_color: 0xD7DCE2

        - obj:
            align: BOTTOM_MID
            x: -20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFFFFF
            border_width: 0

        - obj:
            align: BOTTOM_MID
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - obj:
            align: BOTTOM_MID
            x: 20
            y: -10
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - button:
            align: CENTER
            width: 480
            height: 480
            bg_opa: TRANSP
            border_opa: TRANSP
            shadow_opa: TRANSP

            on_click:
              - lvgl.page.show:
                  id: controls_page
                  animation: MOVE_LEFT


    # ==========================================================
    # PAGE 2 — BATHROOM CONTROLS
    # ==========================================================
    - id: controls_page
      bg_color: 0x101318

      on_swipe_right:
        - lvgl.page.previous:

      on_swipe_left:
        - lvgl.page.next:

      widgets:

        - label:
            align: TOP_LEFT
            x: 28
            y: 25
            text: "Bathroom"
            text_font: roboto36_font
            text_color: 0xFFFFFF

        - label:
            align: TOP_RIGHT
            x: -28
            y: 34
            text: "22.4°  47%"
            text_font: roboto20_font
            text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Lights
        # ------------------------------------------------------
        - button:
            id: bathroom_light_button
            x: 28
            y: 105
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0335"
                  text_font: icon_font
                  text_color: 0xFFD166

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Lights"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "On"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Fan
        # ------------------------------------------------------
        - button:
            id: bathroom_fan_button
            x: 250
            y: 105
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0210"
                  text_font: icon_font
                  text_color: 0x7DD3FC

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Fan"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Auto"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Night
        # ------------------------------------------------------
        - button:
            id: bathroom_night_button
            x: 28
            y: 260
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0594"
                  text_font: icon_font
                  text_color: 0xC4B5FD

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Night"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Scene"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0

        # ------------------------------------------------------
        # Heat
        # ------------------------------------------------------
        - button:
            id: bathroom_heat_button
            x: 250
            y: 260
            width: 202
            height: 135
            radius: 24
            bg_color: 0x1D232B
            border_width: 1
            border_color: 0x323B46
            shadow_width: 0

            widgets:
              - label:
                  align: TOP_LEFT
                  x: 18
                  y: 8
                  text: "\U000F0438"
                  text_font: icon_font
                  text_color: 0xFB923C

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -34
                  text: "Heat"
                  text_font: roboto24_font
                  text_color: 0xFFFFFF

              - label:
                  align: BOTTOM_LEFT
                  x: 18
                  y: -10
                  text: "Off"
                  text_font: roboto16_font
                  text_color: 0xAAB4C0
        - obj:
            align: BOTTOM_MID
            x: -20
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0

        - obj:
            align: BOTTOM_MID
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0xFFFFFF
            border_width: 0

        - obj:
            align: BOTTOM_MID
            x: 20
            y: -18
            width: 8
            height: 8
            radius: 4
            bg_color: 0x59636F
            border_width: 0


    # ==========================================================
    # PAGE 3 — MUSIC AUTOMATIONS
