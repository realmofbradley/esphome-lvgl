    # ==========================================================
    # PAGE 2 — BATHROOM CONTROLS
    # ==========================================================
    - id: controls_page
      bg_color: 0x101318
      pad_all: 0
      scrollable: false
      scrollbar_mode: "off"

      on_swipe_right:
        - lambda: 'id(bathroom_controls_last_swipe) = millis();'
        - lvgl.page.previous:

      on_swipe_left:
        - lambda: 'id(bathroom_controls_last_swipe) = millis();'
        - lvgl.page.next:

      widgets:

        - label:
            align: TOP_LEFT
            x: 28
            y: 25
            text: "Bathroom"
            text_font: roboto36_font
            text_color: 0xFFFFFF

        - label:
            id: bathroom_controls_climate
            align: TOP_RIGHT
            x: -28
