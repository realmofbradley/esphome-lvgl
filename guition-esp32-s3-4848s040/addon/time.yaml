# SNTP Time
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Toronto
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

    on_time_sync:
      - script.execute: time_update

    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            auto now = id(sntp_time).now();

            if (!now.is_valid()) {
              return std::string("--:--");
            }

            char time_buf[6];
            snprintf(time_buf, sizeof(time_buf), "%02d:%02d",
                     now.hour, now.minute);

            return std::string(time_buf);
