http_request:

image:
  - platform: online_image
    id: ambient_background_image
    url: "${ha_base_url}/local/guition/backgrounds/clear-day.jpg"
    format: JPEG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: ambient_background
          src: ambient_background_image
      - logger.log:
          level: WARN
          tag: graphics_diag
          format: "BACKGROUND: update finished"
      - script.execute:
          id: log_memory_diagnostics
          reason: "background_update_finished"
