# TEMPORARY EXPERIMENT: override only ST7701S with the project-contained
# ESPHome 2026.10.1 copy below; its sole functional change is num_fbs = 2.
external_components:
  - source:
      type: git
      url: https://github.com/realmofbradley/esphome-lvgl
      ref: main
      path: guition-esp32-s3-4848s040/components
    refresh: 1sec
    components: [st7701s]
packages:
  device: !include device/device.yaml
  diagnostics: !include device/diagnostics.yaml
  sensors: !include device/sensors.yaml
  controls: !include device/controls.yaml
  media: !include device/media.yaml
  inactivity: !include device/inactivity.yaml
  lvgl: !include device/lvgl.yaml
  backlight: !include addon/backlight.yaml
  time: !include addon/time.yaml
  network: !include addon/network.yaml
  fonts: !include assets/fonts.yaml
  icons: !include assets/icons.yaml
  weather: !include assets/weather.yaml
  backgrounds: !include assets/backgrounds.yaml
  button: !include theme/button.yaml
